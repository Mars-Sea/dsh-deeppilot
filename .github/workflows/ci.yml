name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Verify embedded helper checksum
        working-directory: bin
        run: sha256sum -c SHA256SUMS

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Test helper
        working-directory: helper
        run: go test ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan reachable Go vulnerabilities
        working-directory: helper
        run: govulncheck ./...
