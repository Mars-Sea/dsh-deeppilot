name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Verify embedded helper checksum
        working-directory: bin
        run: sha256sum -c SHA256SUMS

  config-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate plugin config schema against the DSH 0.2.0-rc.2 CLI
        run: npm run check:config-schema

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Test helper
        working-directory: helper
        run: go test ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan reachable Go vulnerabilities
        working-directory: helper
        run: govulncheck ./...
      # SHA256SUMS only proves bin/ was not altered, not that it was built from
      # the current helper/ sources. The build is reproducible on any host, so
      # rebuilding the full matrix here must leave bin/ untouched; anything else
      # means the chore/helper-matrix-refresh PR has not been merged yet.
      # Skipped on pull requests: Dependabot's gomod PRs only bump go.mod and
      # would otherwise stay red until that separate refresh PR lands.
      - name: Rebuild helper matrix
        if: github.event_name == 'push'
        run: sh scripts/build-all-helpers.sh
      - name: Verify bin/ matches helper sources
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- bin)" ]; then
            git status --short -- bin
            echo 'bin/ 与 helper/ 源码不一致：请先合并 chore/helper-matrix-refresh 的刷新 PR，再发布。' >&2
            exit 1
          fi

  # Unit tests only check that every bin/<os>-<arch> file exists. This job
  # starts the committed binary on a native runner for each of the six targets
  # and checks the stdout event the supervisor parses (scripts/smoke-helper.mts).
  helper-smoke:
    name: Helper smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-amd64
            os: macos-15-intel
          - target: windows-amd64
            os: windows-latest
          - target: windows-arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:helper
