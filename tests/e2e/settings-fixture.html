<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepPilot 设置页本地验收</title>
  <style>
    :root{color-scheme:light;--dsw-alias-label-primary:#0f1115;--dsw-alias-label-secondary:#61666b;--dsw-alias-label-tertiary:#81858c;--dsw-alias-label-primary-foreground:#fff;--dsw-alias-settings-card-fill:#fff;--dsw-alias-settings-card-stroke:#e4e5e7;--dsw-alias-bg-layer-2:#fff;--dsw-alias-bg-layer-3:#fff;--dsw-alias-bg-module-platform:#f5f6f8;--dsw-alias-brand-primary:#0f1115;--dsw-alias-button-primary-fill:#0f1115;--dsw-alias-button-primary-hover:#30343b;--dsw-alias-state-success-primary:#287a45;--dsw-alias-state-error-primary:#bc2222;--dsw-alias-state-business-primary:#4176e6}
    :root[data-theme=dark]{color-scheme:dark;--dsw-alias-label-primary:#f0f1f3;--dsw-alias-label-secondary:#afb4bd;--dsw-alias-label-tertiary:#969ca6;--dsw-alias-label-primary-foreground:#111317;--dsw-alias-settings-card-fill:#1c1e22;--dsw-alias-settings-card-stroke:#3a3d43;--dsw-alias-bg-layer-2:#1c1e22;--dsw-alias-bg-layer-3:#22252a;--dsw-alias-bg-module-platform:#292c32;--dsw-alias-brand-primary:#f0f1f3;--dsw-alias-button-primary-fill:#f0f1f3;--dsw-alias-button-primary-hover:#d7dbe3;--dsw-alias-state-success-primary:#83c79b;--dsw-alias-state-error-primary:#ff9c9c}
    *{box-sizing:border-box}body{margin:0;padding:24px;font:14px/20px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--dsw-alias-bg-module-platform);color:var(--dsw-alias-label-primary)}
    .fixture-label{margin:0 auto 12px;max-width:800px;font-size:12px;color:var(--dsw-alias-label-secondary)}
    .fixture-window{margin:auto;width:800px;max-width:100%;min-height:800px;border:1px solid var(--dsw-alias-settings-card-stroke);border-radius:28px;background:var(--dsw-alias-bg-layer-2)}
    .fixture-title{display:flex;align-items:center;height:64px;padding:0 24px;font-size:16px;font-weight:600}
    .fixture-layout{display:flex}.fixture-nav{width:188px;flex:none;padding:0 12px;display:flex;flex-direction:column;gap:0}.fixture-nav span{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:11px}.fixture-nav .active{background:var(--dsw-alias-bg-module-platform)}
    .fixture-pane{flex:1;min-width:0;padding:0 28px 24px 24px}
    @media(max-width:700px){body{padding:12px}.fixture-window{border-radius:20px}.fixture-nav{display:none}.fixture-pane{padding:0 16px 20px}}
  </style>
</head>
<body>
  <p class="fixture-label">本地组件验收夹具 · 使用模拟报告，不连接真实主机</p>
  <div class="fixture-window">
    <div class="fixture-title">设置</div>
    <div class="fixture-layout">
      <nav class="fixture-nav" aria-label="设置分类"><span>通用设置</span><span>模型</span><span>Command Code</span><span class="active">DeepPilot</span><span>内置插件</span><span>Agent 预设</span></nav>
      <main class="fixture-pane" id="app"></main>
    </div>
  </div>
  <script src="/fixture.js"></script>
</body>
</html>
